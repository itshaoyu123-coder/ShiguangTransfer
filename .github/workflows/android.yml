# Modified 2026-10-30 by Shiguang Transfer contributors; LumaLink-derived, Apache-2.0.
name: Shiguang targeted Android checks

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Targeted protocol checks, Android XML compatibility, app checks
        run: >-
          ./gradlew :protocol:test
          --tests '*ProgressiveBrowseTest' --tests '*CameraAccessGateTest' --tests '*UpnpDescriptionResolverTest' --tests '*UpnpFaultParserTest' --tests '*PreviewAccessTest' --tests '*ConnectionCancellationTest' --tests '*CameraDateParserTest' --tests '*CaptureDateHeaderTest'
          --tests '*UpnpContentDirectoryClientTest.parsesEmptyDidlWhenPlatformRejectsOptionalXmlSecurityFeatures'
          --tests '*UpnpContentDirectoryClientTest.parsesRelativeResourceWithRestrictedXmlFactory'
          --tests '*UpnpContentDirectoryClientTest.rejectsDoctypeBeforeOptionalPlatformFeaturesCanPermitEntityResolution'
          :core:testDebugUnitTest :transport:testDebugUnitTest :app:assembleDebug :app:lintDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShiguangTransfer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    needs: build
    if: github.repository == 'itshaoyu123-coder/ShiguangTransfer' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout verified snapshot
        uses: actions/checkout@v4
      - name: Verify the existing test APK
        working-directory: releases/assets
        run: sha256sum --check SHA256SUMS-0.2.18.txt
      - name: Publish the verified alpha if absent
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          if gh release view v0.2.18-alpha >/dev/null 2>&1; then
            echo 'Release already exists; leaving it unchanged.'
          else
            gh release create v0.2.18-alpha \
              releases/assets/ShiguangTransfer-0.2.18-alpha.apk \
              releases/assets/SHA256SUMS-0.2.18.txt \
              --target "$RELEASE_TARGET" \
              --title '拾光传输 0.2.18-alpha' \
              --notes-file releases/v0.2.18-alpha.md \
              --prerelease
          fi
